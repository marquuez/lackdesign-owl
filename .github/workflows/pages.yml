name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nur die oeffentlichen Dateien veroeffentlichen. Server, Adminbereich
      # und Build-Konfiguration bleiben bewusst aussen vor.
      - name: Statische Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html impressum.html datenschutz.html _site/
          cp styles.css main.js legal.js site-config.js robots.txt _site/
          cp -r assets public _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
